name: prometheus-tests

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # Pinned promtool version (bump deliberately, lint rules can change).
  PROMETHEUS_VERSION: "3.13.0"

jobs:
  generate-check:
    name: generate-is-clean
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: false
      - run: make generate
      - run: make is-clean

  promtool-generate-check:
    needs: generate-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install promtool
        run: |
          set -euo pipefail
          name="prometheus-${PROMETHEUS_VERSION}.linux-amd64"
          base="https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}"

          cd "$RUNNER_TEMP"
          curl -fsSLO "${base}/${name}.tar.gz"
          curl -fsSLO "${base}/sha256sums.txt"
          grep "  ${name}.tar.gz\$" sha256sums.txt | sha256sum -c -

          tar -xzf "${name}.tar.gz" "${name}/promtool"
          echo "${RUNNER_TEMP}/${name}" >> "$GITHUB_PATH"

      - name: Check golden metric files with promtool
        run: |
          set -uo pipefail
          shopt -s nullglob

          promtool --version

          files=(internal/info/testdata/prometheus/*.prom)
          if [ ${#files[@]} -eq 0 ]; then
            echo "ERROR: no golden metric files found"
            exit 1
          fi

          rc=0
          for f in "${files[@]}"; do
            echo "Checking ${f}"
            if ! promtool check metrics < "${f}"; then
              echo "ERROR: promtool reported problems in ${f}"
              rc=1
            fi
          done

          exit "${rc}"
